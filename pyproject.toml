[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "njuskalo-mcp"
version = "0.1.0"
description = "MCP server that searches used cars on Njuskalo.hr so Claude can pick the best one"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "curl_cffi>=0.16",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
njuskalo-mcp = "njuskalo_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/njuskalo_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
