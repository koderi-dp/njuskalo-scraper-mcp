# Forward proxy for the Njuskalo MCP server: password-protected and limited to njuskalo.hr.
Port 8888
Listen 0.0.0.0
User tinyproxy
Group tinyproxy
Timeout 120
MaxClients 20
LogLevel Notice
DisableViaHeader Yes

# Credentials are substituted by entrypoint.sh from PROXY_USER / PROXY_PASSWORD.
BasicAuth __USER__ __PASSWORD__

# Only these ports may be tunnelled (HTTPS and HTTP).
ConnectPort 443
ConnectPort 80

# Refuse every destination except the domains listed in the filter file.
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes
