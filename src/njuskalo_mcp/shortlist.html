<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Shortlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EAEE; --surface:#FFFFFF; --ink:#16233B; --muted:#5A6577; --line:#CDD3DC;
  --eu:#1F4FA8; --plate:#FFFFFF; --plate-ink:#111827; --sticker:#F2C230; --warn:#9A3B12;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F141D; --surface:#182131; --ink:#E5E9F0; --muted:#9AA6B8; --line:#2A3547;
    --eu:#4A7BD6; --plate:#EEF1F5; --plate-ink:#111827; --sticker:#E8B923; --warn:#F2A27A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141D; --surface:#182131; --ink:#E5E9F0; --muted:#9AA6B8; --line:#2A3547;
  --eu:#4A7BD6; --plate:#EEF1F5; --plate-ink:#111827; --sticker:#E8B923; --warn:#F2A27A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{max-width:62ch;margin:8px 0 24px}
h1{font:700 clamp(2rem,7vw,3.2rem)/1.02 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:-.01em;margin:0 0 10px}
.lede{color:var(--muted);margin:0}
.grid{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:720px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.grid{grid-template-columns:1fr 1fr 1fr}}
.car{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.car .photo{border:0;padding:0;width:100%;cursor:pointer;font:inherit;display:block;position:relative;aspect-ratio:4/3;background:var(--line);color:var(--muted)}
.car .photo img{display:block;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;font-size:.9rem}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h2{font:600 1.35rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0}
h2 a{color:inherit;text-decoration:none}
h2 a:hover{text-decoration:underline}
.price{font:700 1.7rem/1 "Barlow Condensed","Arial Narrow",sans-serif;white-space:nowrap}
.plate{display:inline-flex;align-items:stretch;border:2px solid var(--plate-ink);border-radius:6px;background:var(--plate);color:var(--plate-ink);overflow:hidden;align-self:flex-start;font:700 1rem/1 "Barlow Condensed","Arial Narrow",sans-serif}
.plate .eu{background:var(--eu);color:#fff;font-size:.62rem;padding:4px 5px;display:flex;align-items:flex-end}
.plate .txt{padding:5px 9px;letter-spacing:.06em}
.plate .dot{width:10px;height:10px;border-radius:50%;background:var(--sticker);align-self:center;margin:0 4px 0 -2px;border:1px solid rgba(0,0,0,.35)}
.plate.soon{border-color:var(--warn)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:.95rem}
dt{color:var(--muted)}
dd{margin:0}
.verdict{margin:0;padding-top:10px;border-top:1px solid var(--line);font-weight:500}
.open{margin-top:auto;background:none;border:0;font:inherit;font-weight:600;cursor:pointer;min-height:44px;font-weight:600;color:var(--eu);text-decoration:none;align-self:flex-start;padding:6px 0}
.open:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--sticker);outline-offset:2px;border-radius:4px}
details{margin-top:32px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:760px}
summary{cursor:pointer;font:600 1.15rem "Barlow Condensed","Arial Narrow",sans-serif}
details ul{margin:10px 0 0;padding-left:1.1em}
details li{margin:6px 0}
details a{color:var(--eu)}
.foot{color:var(--muted);font-size:.85rem;margin-top:22px;max-width:62ch}
.rank{position:absolute;top:10px;left:10px;background:var(--eu);color:#fff;font:700 1rem/1 "Barlow Condensed",sans-serif;border-radius:999px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main id="root">
  <header>
    <h1 id="title">Car shortlist</h1>
    <p class="lede" id="lede"></p>
  </header>
  <div class="grid" id="grid"><p class="empty">Waiting for the shortlist…</p></div>
  <details id="skippedBox" hidden>
    <summary>Ads that were skipped</summary>
    <ul id="skipped"></ul>
  </details>
  <p class="foot">Verdicts are based only on what each ad says. Ask for service records, check the VIN and take any car to an independent inspection before paying.</p>
</main>
<script>
(function(){
  var nextId = 1, pending = {};
  function send(msg){ window.parent.postMessage(msg, '*'); }
  function request(method, params){
    var id = nextId++;
    send({jsonrpc:'2.0', id:id, method:method, params:params || {}});
    return new Promise(function(resolve, reject){ pending[id] = {resolve:resolve, reject:reject}; });
  }
  function notify(method, params){ send(params ? {jsonrpc:'2.0', method:method, params:params} : {jsonrpc:'2.0', method:method}); }

  window.addEventListener('message', function(ev){
    var m = ev.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.id != null && pending[m.id] && !m.method) {
      var p = pending[m.id]; delete pending[m.id];
      if (m.error) p.reject(m.error); else p.resolve(m.result);
      return;
    }
    if (m.method === 'ui/notifications/tool-result') render((m.params || {}).structuredContent);
    else if (m.method === 'ui/notifications/host-context-changed') applyContext(m.params);
    else if (m.method === 'ui/resource-teardown' && m.id != null) send({jsonrpc:'2.0', id:m.id, result:{}});
  });

  function applyContext(ctx){
    if (ctx && (ctx.theme === 'dark' || ctx.theme === 'light')) document.documentElement.setAttribute('data-theme', ctx.theme);
  }

  // Report the full content height (as the ext-apps SDK does) whenever it changes, so the host's
  // frame is never shorter than the page. Width is left to the host.
  var lastHeight = 0;
  function reportSize(){
    var html = document.documentElement, prev = html.style.height;
    html.style.height = 'max-content';
    var height = Math.ceil(html.getBoundingClientRect().height);
    html.style.height = prev;
    if (height !== lastHeight) { lastHeight = height; notify('ui/notifications/size-changed', {height:height}); }
  }
  if (window.ResizeObserver) { var ro = new ResizeObserver(reportSize); ro.observe(document.documentElement); ro.observe(document.body); }
  window.addEventListener('load', reportSize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportSize);
  document.addEventListener('load', function(e){ if (e.target.tagName === 'IMG') reportSize(); }, true);

  function openLink(url){
    request('ui/open-link', {url:url}).catch(function(){ window.open(url, '_blank', 'noopener'); });
  }

  function el(tag, attrs, text){
    var n = document.createElement(tag);
    if (attrs) for (var a in attrs) n.setAttribute(a, attrs[a]);
    if (text != null) n.textContent = text;
    return n;
  }

  // Photos load straight from njuskalo.hr; if the host blocks that, ask the server for them.
  function loadPhotoViaServer(box, car){
    box.querySelector('.ph') || box.appendChild(el('span', {'class':'ph'}, 'Loading photo…'));
    request('tools/call', {name:'get_car_photos', arguments:{ad:car.url, max_photos:1, max_width:640}}).then(function(res){
      var img = ((res && res.content) || []).filter(function(b){ return b.type === 'image' && b.data; })[0];
      if (!img) throw new Error('no photo');
      setPhoto(box, car, 'data:' + (img.mimeType || 'image/jpeg') + ';base64,' + img.data, null);
    }).catch(function(){
      var ph = box.querySelector('.ph'); if (ph) ph.textContent = 'No photo. Tap to open the ad.';
    });
  }
  function setPhoto(box, car, src, onError){
    var old = box.querySelector('img'); if (old) old.remove();
    var img = el('img', {src:src, alt:car.name + ', photo from the ad'});
    img.addEventListener('load', function(){ var ph = box.querySelector('.ph'); if (ph) ph.remove(); });
    if (onError) img.addEventListener('error', onError);
    box.insertBefore(img, box.firstChild);
  }

  // Registration shown as an HR plate; outlined in orange when it runs out within two months.
  function plate(reg){
    var p = el('div', {'class':'plate', title:'Registered until ' + reg, 'aria-label':'Registered until ' + reg});
    var m = /^(\d{1,2})\s*\/\s*(\d{2}|\d{4})$/.exec(reg.trim());
    if (m) {
      var year = m[2].length === 2 ? 2000 + +m[2] : +m[2], now = new Date();
      if ((year - now.getFullYear()) * 12 + (+m[1] - 1 - now.getMonth()) < 2) p.className += ' soon';
    }
    p.appendChild(el('span', {'class':'eu'}, 'HR'));
    p.appendChild(el('span', {'class':'txt'}, 'REG ' + reg.replace(/\/(20)?(\d{2})$/, '/$2')));
    p.appendChild(el('span', {'class':'dot'}));
    return p;
  }

  function render(data){
    if (!data || !data.cars) return;
    if (data.title) { document.getElementById('title').textContent = data.title; document.title = data.title; }
    document.getElementById('lede').textContent = data.subtitle || '';
    var grid = document.getElementById('grid'); grid.textContent = '';
    data.cars.forEach(function(c, i){
      var card = el('article', {'class':'car'});
      var box = el('button', {'class':'photo', type:'button', 'aria-label':'Open the ad for ' + c.name});
      box.appendChild(el('span', {'class':'ph'}, 'Loading photo…'));
      box.appendChild(el('span', {'class':'rank'}, String(i + 1)));
      box.addEventListener('click', function(){ openLink(c.url); });
      card.appendChild(box);
      if (c.image) setPhoto(box, c, c.image, function(){ loadPhotoViaServer(box, c); });
      else loadPhotoViaServer(box, c);

      var b = el('div', {'class':'body'});
      var top = el('div', {'class':'top'});
      var h = el('h2'), ha = el('a', {href:c.url}, c.name); h.appendChild(ha);
      ha.addEventListener('click', function(e){ e.preventDefault(); openLink(c.url); });
      top.appendChild(h);
      top.appendChild(el('div', {'class':'price'}, c.price));
      b.appendChild(top);
      if (c.registered_until) b.appendChild(plate(c.registered_until));
      var dl = el('dl');
      [['Year', c.year], ['Mileage', c.km], ['Engine', c.engine], ['Registered until', c.registered_until], ['Seller', c.seller]]
        .forEach(function(r){ if (r[1]) { dl.appendChild(el('dt', null, r[0])); dl.appendChild(el('dd', null, r[1])); } });
      b.appendChild(dl);
      if (c.verdict) b.appendChild(el('p', {'class':'verdict'}, c.verdict));
      var open = el('button', {'class':'open', type:'button'}, 'Open ad on Njuškalo');
      open.addEventListener('click', function(){ openLink(c.url); });
      b.appendChild(open);
      card.appendChild(b);
      grid.appendChild(card);
    });
    var skipped = data.skipped || [], ul = document.getElementById('skipped'); ul.textContent = '';
    skipped.forEach(function(s){
      var li = el('li'), a = el('a', {href:s.url || '#'}, s.title);
      a.addEventListener('click', function(e){ e.preventDefault(); if (s.url) openLink(s.url); });
      li.appendChild(a); if (s.reason) li.appendChild(document.createTextNode(': ' + s.reason)); ul.appendChild(li);
    });
    document.getElementById('skippedBox').hidden = !skipped.length;
    reportSize();
  }

  request('ui/initialize', {
    protocolVersion:'2026-01-26',
    appInfo:{name:'njuskalo-shortlist', version:'1.0.0'},
    appCapabilities:{availableDisplayModes:['inline']}
  }).then(function(res){
    applyContext(res && res.hostContext);
    notify('ui/notifications/initialized');
    reportSize();
  });
})();
</script>
</body>
</html>
